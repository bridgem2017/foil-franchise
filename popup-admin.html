<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FOIL 팝업배너 관리자</title>
<style>
body{margin:0;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Arial,sans-serif;padding:28px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:42px;letter-spacing:-.05em}
.card{background:#15171f;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;margin:18px 0}
label{display:block;margin:14px 0 6px;font-weight:800}
input,select,textarea{width:100%;box-sizing:border-box;background:#222634;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px}
button{border:0;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#ff4f8b,#9b5cff);color:#fff;margin-top:14px}
pre{white-space:pre-wrap;background:#111;border-radius:18px;padding:18px;color:#b8ffd8}
.note{color:#ff6262;font-weight:900}
</style>
</head>
<body>
<div class="wrap">
<h1>팝업배너 관리자</h1>
<p>아래에서 팝업 내용을 만든 뒤 생성된 코드를 <b>popup-config.js</b>에 붙여넣으면 됩니다. GitHub 정적페이지라 저장 버튼이 서버에 직접 저장되지는 않습니다.</p>
<div class="card">
<label>제목</label><input id="title" value="OO쭈꾸미 100호점 달성">
<label>내용</label><textarea id="text">가맹영업 성장 사례를 확인해보세요.</textarea>
<label>버튼명</label><input id="button" value="문의하기">
<label>링크</label><input id="link" value="#contact">
<label>위치</label><select id="position"><option>bottom-right</option><option>bottom-left</option><option>top-right</option><option>top-left</option><option>center</option></select>
<label>테마</label><select id="theme"><option>pink</option><option>purple</option><option>dark</option></select>
<button onclick="make()">팝업 코드 생성</button>
<p class="note">생성된 코드를 popup-config.js의 window.FOIL_POPUPS 배열 안에 넣으면 됩니다.</p>
<pre id="out"></pre>
</div>
</div>
<script>
function make(){
 const obj={
  id:"popup-"+Date.now(),
  enabled:true,
  title:document.getElementById('title').value,
  text:document.getElementById('text').value,
  button:document.getElementById('button').value,
  link:document.getElementById('link').value,
  position:document.getElementById('position').value,
  theme:document.getElementById('theme').value
 };
 document.getElementById('out').textContent=JSON.stringify(obj,null,2)+",";
}
make();
</script>
</body>
</html>
